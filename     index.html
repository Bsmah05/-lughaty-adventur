const stages=[{"title": "الفهم والاستخراج", "icon": "🌳", "questions": [["ما ضد كلمة «كثير»؟", ["قليل", "واسع", "صغير"], 0], ["ما مفرد كلمة «صعوبات»؟", ["صعوبة", "صعب", "صعاب"], 0], ["ما جمع كلمة «حديقة»؟", ["حدائق", "حديقتان", "حديقة"], 0], ["ما مؤنث كلمة «مسلم»؟", ["مسلمة", "مسلمان", "مسلمون"], 0], ["ما مذكر كلمة «واسعة»؟", ["واسع", "واسعات", "وسع"], 0]]}, {"title": "خريطة الكلمة", "icon": "🗺️", "questions": [["ما معنى كلمة «تقلق»؟", ["تضطرب", "تطمئن", "تبتسم"], 0], ["ما ضد كلمة «تقلق»؟", ["تطمئن", "تخاف", "تضطرب"], 0], ["ما نوع كلمة «تقلق»؟", ["فعل", "اسم", "حرف"], 0], ["ما الاسم المشتق من «تقلق»؟", ["قلق", "حديقة", "واسع"], 0], ["ما نوع جملة «تقلق الأم على أطفالها»؟", ["فعلية", "اسمية", "استفهامية"], 0]]}, {"title": "التراكيب والمدود", "icon": "📚", "questions": [["أي كلمة مما يلي تنتهي بتنوين ضم؟", ["صغارٌ", "صغارٍ", "صغارًا"], 0], ["أي كلمة تنتهي بتنوين كسر؟", ["مجموعاتٍ", "مجموعاتٌ", "مجموعاتًا"], 0], ["أي كلمة تحتوي مدًّا بالألف؟", ["التعاون", "يفكرون", "البيئة"], 0], ["أي كلمة تحتوي مدًّا بالواو؟", ["يحافظون", "البيئة", "اقتراحات"], 0], ["أي كلمة تحتوي مدًّا بالياء؟", ["البيئة", "الساحة", "التعاون"], 0], ["أي كلمة تبدأ بهمزة قطع؟", ["أخذ", "استطاع", "اقتراحات"], 0]]}, {"title": "أسلوب التعجب", "icon": "✨", "questions": [["ما صيغة التعجب من «حديقة نظيفة»؟", ["ما أنظف الحديقة!", "الحديقة نظيفة.", "هل الحديقة نظيفة؟"], 0], ["ما صيغة التعجب من «شتلات كثيرة»؟", ["ما أكثر الشتلات!", "الشتلات كثيرة.", "أين الشتلات؟"], 0], ["ما صيغة التعجب من «وردة زاهية»؟", ["ما أزهى الوردة!", "هذه وردة زاهية.", "هل الوردة زاهية؟"], 0], ["أي جملة تعبر عن التعجب؟", ["ما أحسن ركوب الدراجة!", "أركب الدراجة.", "هل تركب الدراجة؟"], 0]]}, {"title": "الإملاء والمهارات", "icon": "🏆", "questions": [["اختر الكلمة التي تبدأ بهمزة قطع:", ["أمر", "استمرار", "اقتناء"], 0], ["اختر الكلمة التي تبدأ بهمزة وصل:", ["استطاع", "أخذ", "أجاب"], 0], ["أي كلمة فيها حرف مشدد؟", ["ردّ", "فواز", "ساحة"], 0], ["في جملة «قسّم المعلم التلاميذ مجموعاتٍ»، ما نوع تنوين «مجموعاتٍ»؟", ["تنوين كسر", "تنوين ضم", "تنوين فتح"], 0], ["ما الكلمة المناسبة لإكمال «في المدرسة ساحةٌ ...»؟", ["واسعةٌ", "واسعٌ", "واسعًا"], 0]]}];let stage=0,q=0,points=0,name='',answered=false;const $=id=>document.getElementById(id);function start(){name=$('student').value.trim();if(!name){alert('اكتب اسمك يا بطل قبل بدء المغامرة!');$('student').focus();return}stage=0;q=0;points=0;$('home').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}function render(){answered=false;const s=stages[stage],v=s.questions[q];$('bar').innerHTML=stages.map((x,i)=>`<span class="pip ${i<stage?'done':i===stage?'current':''}">${x.icon} ${i+1}</span>`).join('');$('stageTitle').textContent=s.icon+' المرحلة '+(stage+1)+': '+s.title;$('progress').textContent='المستكشف: '+name+' | السؤال '+(q+1)+' من '+s.questions.length+' | النجوم: '+points+' ⭐';$('question').textContent=v[0];$('answers').innerHTML='';v[1].forEach((a,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>choose(i);$('answers').append(b)});$('feedback').textContent='';$('next').classList.add('hidden')}function choose(i){if(answered)return;answered=true;let v=stages[stage].questions[q];let bs=[...$('answers').children];bs.forEach((b,k)=>{b.disabled=true;if(k===v[2])b.classList.add('good');else if(k===i)b.classList.add('bad')});if(i===v[2]){points++;$('feedback').textContent='✅ إجابة صحيحة! حصلت على نجمة ⭐'}else{$('feedback').textContent='🌿 أحسنت المحاولة! الإجابة الصحيحة: '+v[1][v[2]]}$('next').textContent=q===stages[stage].questions.length-1?(stage===stages.length-1?'عرض النتيجة 🏆':'المرحلة التالية 🌿'):'السؤال التالي ←';$('next').classList.remove('hidden')}function advance(){if(!answered)return;q++;if(q>=stages[stage].questions.length){stage++;q=0;if(stage>=stages.length){finish();return}}render();window.scrollTo({top:0,behavior:'smooth'})}function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('finalName').textContent=name;let total=stages.r
